<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keywords" content="Organic Compounds">
    <meta name="description" content="Website for learning Organic Chemistry">
    <meta name="author" content="Ayodeji Michael">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Compounds</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <script src="script.js"></script>
    <style>
        input {
            width: 80%;
        }
    </style>
</head>
<body id="login-signin-body">
    <div id="navbar_container"></div><br><br><br><br><br>
    <center>
    <main id="tutorbot_chat_tab">
        <br>
        <div>
            <h3>Welcome</h3>
            <p>I'm all ears if you need anything</p>
        </div>
        <center>
        <div id="tutorbot_chat_bar">
            <button id="tutorbot_chat_add">+</button>
            <textarea id="tutorbot_input" placeholder=""></textarea>
            <button id="tutorbot_chat_mic">
                    <!--Mic button-->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Microphone capsule body -->
                    <rect x="9" y="2" width="6" height="11" rx="3"></rect>
                <!-- Outer U-shaped stand arc -->
                    <path d="M5 10a7 7 0 0 0 14 0"></path>
                <!-- Center vertical stem -->
                    <line x1="12" y1="17" x2="12" y2="22"></line>
                    </svg>
                    <!-- Stop Icon (Hidden by default) -->
                <svg class="stop-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display: none;">
                    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
            </button>
            <button id="tutorbot_chat_send">➤<button> 
        </div>
        </center><br><br>
    </main>
    </center> <br><br><br><br><br><br><b><br><br><br><br><br></b>
    <div id="footer_container"></div>
</body>
